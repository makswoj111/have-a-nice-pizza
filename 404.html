<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nie ma takiej strony – Have a nice pizza</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .nf { min-height: 100svh; display: grid; place-content: center; gap: 24px; padding: 48px max(16px, 4vw); background: var(--coal) var(--flour); color: var(--cream); text-align: center; }
    .nf__num { font: 600 clamp(96px, 22vw, 240px)/.9 var(--f-head); letter-spacing: -.05em; color: var(--gold); }
    .nf h1 { font: 600 clamp(32px, 4.4vw, 52px)/1.1 var(--f-head); }
    .nf h1 em { font-weight: 400; color: var(--gold); }
    .nf p { max-width: 36ch; margin: 0 auto; color: rgba(245, 239, 230, .8); }
    .nf__btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  </style>
</head>
<body>
  <main class="nf">
    <p class="nf__num" aria-hidden="true">404</p>
    <h1>Tej strony nie ma, <em>pizza jest.</em></h1>
    <p>Adres mógł się zmienić albo ktoś zjadł ostatni kawałek. Wróć na stronę główną albo zamów od razu.</p>
    <div class="nf__btns">
      <a class="btn btn--tomato" href="https://www.pyszne.pl/menu/have-a-nice-pizza" target="_blank" rel="noopener">Zamów online</a>
      <a class="btn btn--line" href="/">Strona główna</a>
    </div>
  </main>
</body>
</html>
